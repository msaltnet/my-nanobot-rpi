[project]
name = "msalt-nanobot"
version = "0.1.0"
description = "nanobot 기반 개인 AI 비서 — 경제 뉴스 브리핑 + 추적 항목 관리"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "msaltnet"}
]

# msalt 고유 의존성만 나열.
# nanobot-ai는 submodule에서 별도로 pip install -e ./nanobot 로 설치.
dependencies = [
    "typer>=0.20.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "httpx>=0.28.0,<1.0.0",
    "feedparser>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
msalt-nanobot = "msalt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "msalt/**/*.py",
    "msalt/**/*.md",
    "msalt/**/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["msalt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["msalt"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
