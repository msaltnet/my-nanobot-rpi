name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install nanobot (submodule)
      run: uv pip install --system -e ./nanobot

    - name: Install my-nanobot-rpi
      run: uv pip install --system -e ".[dev]"

    - name: Run tests
      run: python -m pytest tests/msalt/

    - name: Verify installed dependency ownership boundary
      working-directory: nanobot
      run: python -m pytest tests/agent/test_delivery_ownership.py

    - name: Check installed dependencies
      run: python -m pip check
